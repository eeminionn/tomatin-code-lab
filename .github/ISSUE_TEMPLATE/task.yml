name: Tarea del proyecto
description: Registra una tarea concreta de mantenimiento o documentación.
title: "[Tarea]: "
labels: [maintenance]
assignees: [eeminionn]
body:
  - type: textarea
    id: goal
    attributes:
      label: Objetivo
      placeholder: Explica brevemente qué debe quedar listo.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Pasos
      placeholder: "- [ ] Primer paso\n- [ ] Segundo paso"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: ¿Cómo sabremos que está listo?
    validations:
      required: true
