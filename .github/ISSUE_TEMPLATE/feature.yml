name: Proponer una mejora
description: Comparte una idea para hacer más útil o agradable la plataforma.
title: "[Mejora]: "
labels: [enhancement]
assignees: [eeminionn]
body:
  - type: dropdown
    id: audience
    attributes:
      label: ¿A quién ayuda?
      options:
        - Estudiantes
        - Profesor
        - Ambos
        - Quienes contribuyen
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Tu idea
      placeholder: Describe qué te gustaría cambiar o agregar.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: ¿Por qué sería útil?
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Captura, dibujo o referencia
      description: Opcional.
