name: Reportar un error
description: Cuéntanos qué no funcionó.
title: "[Bug]: "
labels: [bug]
assignees: [eeminionn]
body:
  - type: dropdown
    id: area
    attributes:
      label: ¿Dónde ocurrió?
      options:
        - Vista del estudiante
        - Panel del profesor
        - Editor o ejecución de código
        - Inicio de sesión
        - Documentación
        - Otro
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué pasó?
      placeholder: Explica el problema con tus palabras.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: ¿Cómo podemos repetirlo?
      placeholder: "1. Abrí...\n2. Presioné...\n3. Apareció..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ¿Qué esperabas que ocurriera?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Captura o información adicional
      description: No incluyas contraseñas, tokens ni datos personales.
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmación
      options:
        - label: Revisé que el reporte no contenga información privada.
          required: true
