name: Reportar un error
description: Informa un comportamiento incorrecto o una regresión reproducible.
title: "[Bug]: "
labels:
  - bug
assignees:
  - eeminionn
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a mejorar Tomatin Code Lab. No incluyas tokens, contraseñas, soluciones privadas ni datos personales de estudiantes.
  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options:
        - Aula del estudiante
        - Panel del mentor
        - Misiones o evaluador
        - Autenticación e invitaciones
        - Sincronización con GitHub
        - Accesibilidad o diseño responsive
        - Documentación o infraestructura
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Descripción
      description: Explica qué ocurrió y cuál es el impacto.
      placeholder: Al intentar..., la aplicación...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      description: Incluye el recorrido mínimo y datos de ejemplo no sensibles.
      placeholder: |
        1. Iniciar sesión como...
        2. Abrir...
        3. Presionar...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual y evidencia
      description: Puedes arrastrar capturas o pegar errores ya redactados.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: URL, navegador, sistema operativo y tamaño de pantalla.
      placeholder: Beta, Safari 18, macOS, 1440 × 900
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación sugeridos
      description: ¿Qué debería comprobarse para cerrar este issue?
      placeholder: |
        - [ ] El recorrido termina sin errores.
        - [ ] Existe una prueba de regresión.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmaciones
      options:
        - label: Busqué issues existentes y no encontré uno equivalente.
          required: true
        - label: Eliminé secretos y datos personales de la evidencia.
          required: true

