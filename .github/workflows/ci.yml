name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fork-scope:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject backend changes from forks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          blocked=0
          while IFS= read -r path; do
            case "$path" in
              supabase/*|.github/workflows/*|scripts/*)
                echo "::error file=$path::Fork contributions are frontend-only."
                blocked=1
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA"...HEAD)
          exit "$blocked"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.9.0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated catalog
        run: |
          pnpm seed:generate
          git diff --exit-code -- supabase/seed.sql supabase/migrations/202607300003_mission_catalog_v3_visible_inputs.sql v2/src/data/missions-public.generated.ts

      - name: Run checks
        run: pnpm check

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser journeys
        run: pnpm test:e2e

      - name: Verify frontend-only sandbox
        run: pnpm test:e2e:frontend

  database-test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start local database
        run: supabase db start

      - name: Run RLS tests
        run: supabase test db
