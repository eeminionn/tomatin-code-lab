name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.9.0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated catalog
        run: |
          pnpm seed:generate
          git diff --exit-code -- supabase/seed.sql supabase/migrations/202607250002_mission_catalog.sql v2/src/data/missions-public.generated.ts

      - name: Run checks
        run: pnpm check

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser journeys
        run: pnpm test:e2e

  database-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start local database
        run: supabase db start

      - name: Run RLS tests
        run: supabase test db
