name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'eeminionn/tomatin-code-lab'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Use pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.9.0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Verify production configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || {
            echo "::error::Missing repository variable VITE_SUPABASE_URL."
            exit 1
          }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || {
            echo "::error::Missing repository variable VITE_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          }

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble static site
        run: |
          mkdir _site
          cp -R dist-app/. _site/
          cp dist-app/index.html _site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test stable application
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          root_url="${PAGE_URL%/}/"
          for attempt in {1..12}; do
            curl \
              --fail \
              --silent \
              --show-error \
              --output app.html \
              "$root_url"
            if grep -Fq "<title>Tomatin Code Lab</title>" app.html \
              && grep -Fq "/$REPOSITORY_NAME/assets/" app.html; then
              curl --fail --silent --show-error --output redirect.html "${root_url}beta/"
              if grep -Fq "Redirigiendo a Tomatin Code Lab" redirect.html; then
                exit 0
              fi
            fi
            echo "Waiting for GitHub Pages propagation ($attempt/12)."
            sleep 5
          done
          echo "::error::The stable Tomatin Code Lab application was not available at the root URL."
          exit 1
