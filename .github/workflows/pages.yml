name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Use pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.9.0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Verify beta configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || {
            echo "::error::Missing repository variable VITE_SUPABASE_URL."
            exit 1
          }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || {
            echo "::error::Missing repository variable VITE_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          }

      - name: Build beta
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html 404.html styles.css manifest.webmanifest robots.txt sitemap.xml sw.js .nojekyll _site/
          cp -R assets js _site/
          cp -R dist-beta _site/beta

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test beta
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          beta_url="${PAGE_URL%/}/beta/"
          for attempt in {1..12}; do
            curl \
              --fail \
              --silent \
              --show-error \
              --output beta.html \
              "$beta_url"
            if grep -Fq "<title>Tomatin Code Lab 3.0</title>" beta.html \
              && grep -Fq "/tomatin-code-lab/beta/assets/" beta.html; then
              exit 0
            fi
            echo "Waiting for GitHub Pages propagation ($attempt/12)."
            sleep 5
          done
          echo "::error::The deployed beta did not expose Tomatin Code Lab 3.0."
          exit 1
