name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'eeminionn/tomatin-code-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUBMISSION_REPOSITORY_TOKEN: ${{ secrets.SUBMISSION_REPOSITORY_TOKEN }}
      NOTIFICATION_REPOSITORY_TOKEN: ${{ secrets.NOTIFICATION_REPOSITORY_TOKEN }}
      SUBMISSION_REPOSITORY_OWNER: ${{ vars.SUBMISSION_REPOSITORY_OWNER }}
      SUBMISSION_REPOSITORY_NAME: ${{ vars.SUBMISSION_REPOSITORY_NAME }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify production configuration
        run: |
          test -n "$PROJECT_ID" || {
            echo "::error::Missing secret SUPABASE_PROJECT_ID."
            exit 1
          }
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Missing secret SUPABASE_ACCESS_TOKEN."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::Missing secret SUPABASE_DB_PASSWORD."
            exit 1
          }
          test -n "$SUBMISSION_REPOSITORY_TOKEN" || {
            echo "::error::Missing secret SUBMISSION_REPOSITORY_TOKEN."
            exit 1
          }
          if test -z "$NOTIFICATION_REPOSITORY_TOKEN"; then
            echo "::warning::Missing NOTIFICATION_REPOSITORY_TOKEN; notifications will temporarily reuse SUBMISSION_REPOSITORY_TOKEN."
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push

      - name: Verify central submission repository
        run: |
          owner="${SUBMISSION_REPOSITORY_OWNER:-eeminionn}"
          repository="${SUBMISSION_REPOSITORY_NAME:-tomatin-code-lab-resoluciones}"
          status="$(
            curl --silent --show-error \
              --output repository.json \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $SUBMISSION_REPOSITORY_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$owner/$repository"
          )"
          test "$status" = "200" || {
            echo "::error::The submission token cannot access $owner/$repository (HTTP $status)."
            exit 1
          }
          jq --exit-status \
            '.private == true and .permissions.push == true' \
            repository.json >/dev/null || {
              echo "::error::$owner/$repository must be private and writable by the submission token."
              exit 1
            }

      - name: Verify GitHub notification channel
        run: |
          token="${NOTIFICATION_REPOSITORY_TOKEN:-$SUBMISSION_REPOSITORY_TOKEN}"
          status="$(
            curl --silent --show-error \
              --output notification-issue.json \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $token" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/eeminionn/tomatin-code-lab/issues/59"
          )"
          if test "$status" != "200"; then
            message="The notification token cannot access eeminionn/tomatin-code-lab#59 (HTTP $status)."
            if test -n "$NOTIFICATION_REPOSITORY_TOKEN"; then
              echo "::error::$message"
              exit 1
            fi
            echo "::warning::$message Add NOTIFICATION_REPOSITORY_TOKEN with Issues: Read and write."
          fi

      - name: Configure repository sync and notifications
        run: |
          owner="${SUBMISSION_REPOSITORY_OWNER:-eeminionn}"
          repository="${SUBMISSION_REPOSITORY_NAME:-tomatin-code-lab-resoluciones}"
          allowed_origins="${APP_ORIGIN:-https://${GITHUB_REPOSITORY_OWNER}.github.io}"
          secrets=(
            GITHUB_REPOSITORY_TOKEN="$SUBMISSION_REPOSITORY_TOKEN"
            GITHUB_REPOSITORY_OWNER="$owner"
            GITHUB_REPOSITORY_NAME="$repository"
            ALLOWED_ORIGINS="$allowed_origins"
          )
          if test -n "$NOTIFICATION_REPOSITORY_TOKEN"; then
            secrets+=(GITHUB_NOTIFICATION_TOKEN="$NOTIFICATION_REPOSITORY_TOKEN")
          fi
          supabase secrets set \
            --project-ref "$PROJECT_ID" \
            "${secrets[@]}"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_ID"
