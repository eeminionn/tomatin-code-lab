name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GITHUB_REPOSITORY_TOKEN: ${{ secrets.GITHUB_REPOSITORY_TOKEN }}
      GITHUB_REPOSITORY_OWNER: ${{ vars.GITHUB_REPOSITORY_OWNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        if: env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Link project
        if: env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        if: env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        run: supabase db push

      - name: Configure repository sync
        if: env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.GITHUB_REPOSITORY_TOKEN != ''
        run: |
          owner="${GITHUB_REPOSITORY_OWNER:-eeminionn}"
          supabase secrets set \
            --project-ref "$PROJECT_ID" \
            GITHUB_REPOSITORY_TOKEN="$GITHUB_REPOSITORY_TOKEN" \
            GITHUB_REPOSITORY_OWNER="$owner"

      - name: Deploy Edge Functions
        if: env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        run: supabase functions deploy --project-ref "$PROJECT_ID"

      - name: Backend not configured
        if: env.PROJECT_ID == '' || env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_DB_PASSWORD == ''
        run: echo "Supabase deployment skipped until repository secrets are configured."
